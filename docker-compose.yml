services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: glassbox-ats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glassbox
      POSTGRES_PASSWORD: glassbox_secret
      POSTGRES_DB: glassbox_ats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glassbox -d glassbox_ats"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: glassbox-ats-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://glassbox:glassbox_secret@postgres:5432/glassbox_ats
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glassbox-ats-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
