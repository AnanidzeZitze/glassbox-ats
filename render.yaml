# Render.com Full-Stack Blueprint — Glass-Box ATS Simulator & Optimization Studio
services:
  - type: web
    name: glassbox-ats-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"
      - key: RATE_LIMIT_RPM
        value: "120"
    healthCheckPath: /api/v1/health

  - type: web
    name: glassbox-ats-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://glassbox-ats-backend.onrender.com/api/v1
