# Render.com Blueprint — Glass-Box ATS Simulator & Optimization Studio
services:
  - type: web
    name: glassbox-ats-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"
      - key: RATE_LIMIT_RPM
        value: "120"
    healthCheckPath: /api/v1/health
